name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The artwork lives in its own repository and the deployed site loads it from there. It is only checked out
      # here so the tests that read the picture files can run, so a missing or removed artwork repository must not
      # stop the editor from deploying (those tests skip themselves).
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Noxxionmurph/SaveHub-assets
          path: assets
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
